[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-alzheimer-mri-classifier"
version = "1.0.0"
description = "Educational four-class Alzheimer MRI image classifier"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8,<3.12"
dependencies = [
  "numpy==1.24.3",
  "tensorflow==2.13.0",
  "scikit-learn==1.3.2",
  "joblib==1.4.2",
  "matplotlib==3.7.5",
  "Pillow==10.4.0",
]

[project.scripts]
alzheimer-audit = "alzheimer_detection.audit:main"
alzheimer-classifier = "alzheimer_detection.classical:main"
alzheimer-prepare = "alzheimer_detection.prepare_dataset:main"

[project.urls]
Repository = "https://github.com/i-am-ramprakash/Alzheimer-s-Disease-Detection-from-MRI"

[tool.setuptools.packages.find]
include = ["alzheimer_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
